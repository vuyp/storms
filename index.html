<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Florida Storm — hunker down</title>
  <meta name="description" content="A first-person, physically modelled simulation of riding out a Gulf Coast hurricane at home in Florida." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #05070a; color: #e6e6e6; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    #overlay > * { pointer-events: auto; }
    #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #05070a; color: #cfd6dd; font-size: 14px; letter-spacing: 0.04em; z-index: 50; }
    #boot .bar { width: 240px; height: 3px; background: #1a222b; border-radius: 2px; overflow: hidden; }
    #boot .bar > i { display: block; height: 100%; width: 0%; background: #6bd0ff; transition: width .3s; }
    #boot.done { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gl" tabindex="0"></canvas>
    <div id="overlay"></div>
    <div id="boot"><div>4212 SANDPIPER COVE</div><div class="bar"><i id="bootbar"></i></div><div id="bootmsg">Loading…</div></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
